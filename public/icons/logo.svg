<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c542" />
      <stop offset="45%" stop-color="#ffd875" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="innerShield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e1834" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="goldKnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="40%" stop-color="#f5c542" />
      <stop offset="80%" stop-color="#c9932a" />
      <stop offset="100%" stop-color="#92620f" />
    </linearGradient>
    <linearGradient id="purpleFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Outer Frame -->
  <polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="url(#innerShield)" stroke="url(#hexGrad)" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="50,11 83,30 83,70 50,89 17,70 17,30" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4 2" />

  <!-- Crown -->
  <polygon points="38,28 34,16 44,22 50,13 56,22 66,16 62,28" fill="url(#goldKnight)" stroke="#ffd875" stroke-width="0.8" stroke-linejoin="round" />
  <circle cx="50" cy="21" r="1.2" fill="#38bdf8" />

  <!-- Knight Piece -->
  <path d="M32 78 L68 78 L65 73 L35 73 Z" fill="url(#goldKnight)" stroke="#ffd875" stroke-width="0.8" />
  <polygon points="37,73 45,55 55,55 63,73" fill="url(#purpleFacet)" stroke="#c084fc" stroke-width="0.6" />
  <polygon points="45,55 50,38 55,55" fill="url(#goldKnight)" stroke="#ffd875" stroke-width="0.6" />
  <polygon points="53,32 62,35 60,43 51,39" fill="#7e22ce" stroke="#a855f7" stroke-width="0.5" />
  <polygon points="55,42 64,45 62,54 53,50" fill="#6b21a8" stroke="#a855f7" stroke-width="0.5" />
  <polygon points="56,53 66,56 63,65 54,61" fill="#581c87" stroke="#a855f7" stroke-width="0.5" />
  <polygon points="50,33 41,36 34,44 38,47 43,44 48,46 51,39" fill="url(#goldKnight)" stroke="#fff" stroke-width="0.8" stroke-linejoin="round" />
  <polygon points="34,44 38,47 41,52 38,51" fill="#92620f" stroke="#f5c542" stroke-width="0.6" />
  <polygon points="43,44 48,46 47,56 42,53" fill="url(#purpleFacet)" stroke="#c084fc" stroke-width="0.5" />
  <circle cx="42" cy="41" r="1.3" fill="#ffffff" filter="url(#glow)" />
  <path d="M48 46 L45 55 L42 66" fill="none" stroke="#ffd875" stroke-width="0.9" stroke-linecap="round" />
</svg>
